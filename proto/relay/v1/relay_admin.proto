syntax = "proto3";

package cs.im.relay.v1;

option go_package = "github.com/kurosann/cs-im-internal-sdk/relay/v1;relayv1";

service RelayWebhookService {
  rpc CreateWebhook(RelayWebhookCreateRequest) returns (RelayWebhookResponse);
  rpc ListWebhooks(RelayWebhookListRequest) returns (RelayWebhookListResponse);
  rpc GetWebhook(RelayWebhookGetRequest) returns (RelayWebhookResponse);
  rpc UpdateWebhook(RelayWebhookUpdateRequest) returns (RelayWebhookResponse);
  rpc TestWebhook(RelayWebhookTestRequest) returns (RelayWebhookResponse);
  rpc SetWebhookStatus(RelayWebhookSetStatusRequest) returns (RelayWebhookResponse);
  rpc DeleteWebhook(RelayWebhookDeleteRequest) returns (RelayWebhookDeleteResponse);
}

service RelayAIService {
  rpc GetAIConfig(RelayGetAIConfigRequest) returns (RelayAIConfigResponse);
  rpc UpdateAIConfig(RelayUpdateAIConfigRequest) returns (RelayAIConfigResponse);
  rpc ListAIExecutions(RelayAIExecutionListRequest) returns (RelayAIExecutionListResponse);
}

message RelayWebhook {
  string webhook_id = 1;
  string name = 2;
  string url = 3;
  repeated string events = 4;
  string secret = 5;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
}

message RelayWebhookCreateRequest {
  string name = 1;
  string url = 2;
  repeated string events = 3;
  bool is_active = 4;
}

message RelayWebhookUpdateRequest {
  string webhook_id = 1;
  string name = 2;
  string url = 3;
  repeated string events = 4;
  bool is_active = 5;
}

message RelayWebhookListRequest {}

message RelayWebhookListResponse {
  repeated RelayWebhook items = 1;
}

message RelayWebhookGetRequest {
  string webhook_id = 1;
}

message RelayWebhookResponse {
  RelayWebhook webhook = 1;
}

message RelayWebhookTestRequest {
  string webhook_id = 1;
}

message RelayWebhookSetStatusRequest {
  string webhook_id = 1;
  bool enabled = 2;
}

message RelayWebhookDeleteRequest {
  string webhook_id = 1;
}

message RelayWebhookDeleteResponse {}

message RelayAIConfig {
  string prompt = 1;
  int32 history_message_count = 2;
  bool auto_reply_enabled = 3;
  bool reporting_enabled = 4;
}

message RelayGetAIConfigRequest {}

message RelayUpdateAIConfigRequest {
  string prompt = 1;
  int32 history_message_count = 2;
  bool auto_reply_enabled = 3;
  bool reporting_enabled = 4;
}

message RelayAIConfigResponse {
  RelayAIConfig config = 1;
}

message RelayAIExecution {
  string execution_id = 1;
  string conversation_id = 2;
  string message_id = 3;
  string action = 4;
  string result = 5;
  string created_at = 6;
}

message RelayAIExecutionListRequest {}

message RelayAIExecutionListResponse {
  repeated RelayAIExecution items = 1;
}
